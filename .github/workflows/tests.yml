name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flake8
      - run: python -m flake8 serve.py runner_api.py llm_stages.py
      - run: python -m py_compile serve.py runner_api.py llm_stages.py
      - name: The pipelines are valid JSON
        run: python -c "import json,glob; [json.load(open(p)) for p in glob.glob('pipelines/*.json')]; print('ok')"
